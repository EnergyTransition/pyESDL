[versioneer]
VCS = git
style = pep440
versionfile_source = esdl/_version.py
versionfile_build = esdl/_version.py
tag_prefix =
parentdir_prefix = pyESDL-


[tool:pytest]
addopts = --verbose
python_files = tests/*_test.py test_*.py


[mypy]
exclude = (?x)(
    (^|/)(build|dist)/
    | ^esdl/esdl\.py$
    | ^edd/edd\.py$
    | ^esdl/project/esdlproject\.py$
    | ^esdl/_version\.py$
    | ^esdl/__init__\.py$
    | ^edd/__init__\.py$
    | ^esdl/project/__init__\.py$
    )

[mypy-esdl,esdl.esdl,edd,edd.edd,esdl.project,esdl.project.esdlproject,esdl._version]
ignore_errors = True