name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

permissions:
  contents: read

env:
  CI_COMMIT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    container: python:${{ matrix.python-version }}-slim
    services:
      postgres:
        image: postgis/postgis:17-master
        env:
          POSTGRES_DB: energy_profiles
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
      influxdb:
        image: influxdb:1.7
        env:
          INFLUXDB_ADMIN_USER: admin
          INFLUXDB_ADMIN_PASSWORD: admin
    env:
      POSTGRES_DB: energy_profiles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: admin
      PYESDL_POSTGRES_HOST: postgres
      PYESDL_POSTGRES_PORT: '5432'
      PYESDL_POSTGRES_USER: postgres
      PYESDL_POSTGRES_PASSWORD: password
      PYESDL_POSTGRES_PROFILE_DB: timeseries_profile
      PYESDL_INFLUXDB_HOST: influxdb
      PYESDL_INFLUXDB_PORT: '8086'
      PYESDL_INFLUXDB_USER: admin
      PYESDL_INFLUXDB_PASSWORD: admin
    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y curl git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Python dependencies
        run: |
          python3 -m pip install --user --upgrade setuptools wheel twine versioneer future-fstrings
          python3 -m pip install --user -r requirements.txt
      - name: Wait for database services
        run: |
          python3 - <<'PY'
          import socket
          import time

          def wait_for(host, port, timeout=180):
              deadline = time.time() + timeout
              while time.time() < deadline:
                  with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                      s.settimeout(2)
                      try:
                          s.connect((host, port))
                          return
                      except OSError:
                          time.sleep(2)
              raise RuntimeError(f"Service not reachable: {host}:{port}")

          wait_for("postgres", 5432)
          wait_for("influxdb", 8086)
          print("Database services are reachable")
          PY
      - name: Run tests
        run: |
          git describe
          echo "$CI_COMMIT_TAG"
          python3 -m pytest tests

